name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - main  # main 브랜치에 push하면 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # 기본 GITHUB_TOKEN credential 제거

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'  # 로컬에서 사용하는 Ruby 버전과 동일하게 설정

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll Site
        run: bundle exec jekyll build

      - name: Check if GH_PATH is set
        run: |
          if [[ -z "${{ secrets.GH_PATH }}" ]]; then
            echo "❌ GH_PATH is not set"
            exit 1
          else
            echo "✅ GH_PATH is set"
          fi
      - name: Configure Git with GH_PATH
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 여기서 GH_PATH가 Secrets로부터 가져와지는지 확인
          git remote set-url origin https://x-access-token:${{ secrets.GH_PATH }}@github.com/2JAE22/2JAE22.github.io.git

          # 혹시 shallow clone 상태라면 풀어줍니다(선택 사항)
          git fetch --unshallow || true

          # remote 설정이 잘 됐는지 확인 (디버깅용)
          git remote -v

      - name: Commit & Push changes
        run: |
          git add .
          git commit -m "🚀 Auto-deploy Jekyll site"
          # main 브랜치로 푸시
          git push origin main

