name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - main  # main 브랜치에 push하면 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'  # 로컬에서 사용하는 Ruby 버전과 동일하게 설정

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll Site
        run: bundle exec jekyll build

      - name: Check if GH_PATH is set
        run: |
          if [[ -z "${{ secrets.GH_PATH }}" ]]; then
            echo "❌ GH_PATH is not set"
            exit 1
          else
            echo "✅ GH_PATH is set"
          fi

      - name: Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PATH }}@github.com/2JAE22/2JAE22.github.io.git
          git add .
          git commit -m "🚀 Auto-deploy Jekyll site"
          git push origin main
