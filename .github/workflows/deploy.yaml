name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - main  # main 브랜치에서 배포 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # 기본 GITHUB_TOKEN 제거

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll Site
        run: bundle exec jekyll build

      - name: Check if GH_PATH is set
        run: |
          if [[ -z "${{ secrets.GH_PATH }}" ]]; then
            echo "❌ GH_PATH is not set"
            exit 1
          else
            echo "✅ GH_PATH is set"
          fi

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Deploy to GitHub Pages (gh-pages 브랜치)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # gh-pages 브랜치 생성 (기록 없이)
          git checkout --orphan gh-pages
          git rm -rf . || true

          # 빌드 결과물을 현재 디렉토리로 복사
          cp -R _site/* .

          git add .
          # 변경사항이 없더라도 빈 커밋을 만들거나, 강제로 커밋하도록 할 수 있습니다.
          git commit -m "🚀 Deploy Jekyll site" --allow-empty
          git push -f origin gh-pages
