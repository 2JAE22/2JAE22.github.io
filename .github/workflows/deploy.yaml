name: Deploy Jekyll site to Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --path vendor/bundle

      - name: Build Jekyll site
        run: |
          bundle exec jekyll build --trace || (echo "Jekyll build failed!" && exit 1)

      - name: Debug Check _site folder
        run: |
          echo "Checking _site folder..."
          ls -l _site || (echo "_site folder not found!" && exit 1)

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-artifact@v4  # Use a standard upload action for clarity
        with:
          name: jekyll-site
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # Update to v4 for compatibility
        with:
          artifact_name: jekyll-site  # Specify the artifact name if needed
