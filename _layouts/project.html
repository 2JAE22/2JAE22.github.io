---
layout: default
---

<section class="hero hero--single">

	<div class="hero__image" style="background-image: url({{ page.featured_image | relative_url }})">
		<div class="hero__overlay"></div>
	</div>

	<div class="wrap">

		<h1>{{ page.title }}</h1>
		<p>Project Duration: {{ page.start_date }} ~ {{ page.end_date | default: 'now' }}</p>
		<p>Updated on {{ page.last_modified_at | date_to_long_string}}</p>
	
	</div>

</section>

<section class="single">

	<div class="wrap">

		<article class="single-post">

			{{ page.content }}

		</article>

	</div>

</section>
